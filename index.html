<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tic Tac Glow</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="game-container">
    <h1 class="title">TIC TAC GLOW</h1>

    <div class="controls">
      <label for="difficulty">Difficulty:</label>
      <select id="difficulty">
        <option value="easy">Easy</option>
        <option value="medium">Medium</option>
        <option value="hard" selected>Hard</option>
      </select>
    </div>

    <div id="board" class="board"></div>

    <div class="scoreboard">
      <span>Wins: <span id="wins">0</span></span>
      <span>Losses: <span id="losses">0</span></span>
      <span>Draws: <span id="draws">0</span></span>
    </div>

    <button id="restart">Restart</button>
  </div>

  <div id="popup" class="popup hidden">
    <div class="popup-content">
      <h2 id="popup-message"></h2>
      <button id="close-popup">Play Again</button>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
